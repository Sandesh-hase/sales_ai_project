# This is a Declarative Automation Bundle definition for sales_ai.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: sales_ai
  uuid: 2a2b56c0-28b6-40d9-9e28-3ef2b39a87db

include:
  - resources/*.yml

sync:
  paths:
    - .
  include:
    - src/sales_ai/*.py

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-0101d67c-183e.cloud.databricks.com
    variables:
      catalog: sales_ai
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-0101d67c-183e.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/sandeshhase20@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/sandeshhase20@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: sales_ai
      schema: prod
    permissions:
      - user_name: sandeshhase20@gmail.com
        level: CAN_MANAGE
